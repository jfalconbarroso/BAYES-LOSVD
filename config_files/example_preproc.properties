[NGC0000]
filename     = "NGC0000.fits"
instrument   = "MUSE-WFM"
redshift     = 0.008764
lmin         = 4825.0
lmax         = 5500.0
vmax         = 700.0
velscale     = 60.0
snr          = 50.0
