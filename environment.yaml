name: bayes_losvd

channels:
  - conda-forge

dependencies:
  - python=3.12

  # Core numerical/data stack
  - numpy
  - scipy
  - pandas
  - xarray
  - h5py

  # Bayesian inference / JAX
  - jax
  - numpyro
  - arviz

  # Astronomy
  - astropy

  # Plotting and visualization
  - matplotlib
  - plotly

  # Analysis / utilities
  - scikit-learn
  - tqdm
  - toml

  # Interactive environment
  - ipython
  - ipykernel
  - ipywidgets

  # pip-only dependencies
  - pip
  - pip:
      - powerbin==1.1.9